name: Build, test and release
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/build-icons.cjs --check
      - run: python3 scripts/version.py --check && python3 webview/embed_features.py
      - run: git diff --exit-code -- webview/index.html webview/version.h webview/app.manifest
      - run: python3 scripts/check-public-source.py
      - run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - run: npm test
      - run: g++ -std=c++17 -O2 -Wall -Wextra tests/update-protocol-tests.cpp -o /tmp/update-tests && /tmp/update-tests
      - run: g++ -std=c++17 tests/spec-network-policy-test.cpp -o /tmp/spec-policy && /tmp/spec-policy
      - name: Prepare browser
        shell: bash
        run: |
          if command -v google-chrome >/dev/null; then
            echo "CI_CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - run: npm run test:browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: browser-diagnostics
          path: test-results/
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      # Release builds from main are Authenticode signed with Azure Artifact Signing once the
      # repository variables below are set (docs/CODE_SIGNING.md). GitHub signs in to Azure with
      # OIDC, so no password or client secret is stored anywhere.
      SIGN: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ARTIFACT_SIGNING_PROFILE != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: scripts\build-windows.cmd
        shell: cmd
      - name: Sign in to Azure (OIDC)
        if: env.SIGN == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Sign the executable
        if: env.SIGN == 'true'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\dist\Config_Inspector.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Config Inspector
          description-url: https://github.com/${{ github.repository }}
      - name: Verify the signature and repackage the signed executable
        if: env.SIGN == 'true'
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature dist\Config_Inspector.exe
          if ($sig.Status -ne 'Valid' -or -not $sig.TimeStamperCertificate) { throw "Signature check failed: $($sig.Status) $($sig.StatusMessage)" }
          Write-Host "Signed by: $($sig.SignerCertificate.Subject)"
          python scripts\package_portable.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts\checksums.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-release
          path: dist/*
          if-no-files-found: error
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: windows-release
          path: dist
      - name: Publish release downloads after all checks pass
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(tr -d '\r\n' < VERSION)
          tag="v$version"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Version $version is already released; preserve its binaries and add only missing portable downloads."
            python3 scripts/backfill_portable.py
            exit 0
          fi
          test -s "docs/releases/$version.md"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Config Inspector $version" --notes-file "docs/releases/$version.md" --draft dist/*
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest
