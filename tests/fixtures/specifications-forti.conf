#config-version=FGT100F-7.4.0-FW-build0000-240101:opmode=0:vdom=1
config system global
 set hostname "Example specifications"
end
config system interface
 edit port1
  set type physical
  set ip 192.0.2.1 255.255.255.0
 next
 edit port13
  set type physical
  set ip 198.51.100.1 255.255.255.0
 next
 edit port17
  set type physical
  set ip 203.0.113.1 255.255.255.0
 next
 edit x1
  set type physical
  set ip 198.18.0.1 255.255.255.0
  set speed 10000full
 next
 edit port12
  set type physical
  set status up
 next
 edit modem
  set type physical
 next
 edit vlan20
  set type vlan
  set interface port1
  set vlanid 20
  set ip 192.0.2.20 255.255.255.0
 next
end
config vpn ssl web portal
 edit "Both modes"
  set tunnel-mode enable
  set web-mode enable
 next
 edit "Tunnel only"
  set tunnel-mode enable
 next
 edit "Web only"
  set web-mode enable
 next
 edit "Web disabled"
  set web-mode disable
 next
end
