#config-version=FGT100F-7.4.8-FW-build0000
config system global
 set hostname "Review-Forti"
 set admin-https-ssl-versions tlsv1-0 tlsv1-2
 set admintimeout 0
 set admin-server-cert "Expired-Test"
end
config system interface
 edit "wan1"
  set ip 192.0.2.1 255.255.255.0
  set type physical
  set role wan
  set allowaccess http https ssh
 next
 edit "lan1"
  set ip 10.10.10.1 255.255.255.0
  set type physical
 next
 edit "lan2"
  set ip 10.10.10.1 255.255.255.0
  set type physical
 next
 edit "standby"
  set ip 10.20.20.1 255.255.255.0
  set status down
 next
end
config system admin
 edit "test-admin"
  set accprofile "super_admin"
  set vdom "root"
  set trusthost1 0.0.0.0 0.0.0.0
  set two-factor disable
  set password ENC NEVER_EXPORT_THIS_SECRET
 next
end
config system snmp community
 edit 1
  set name "public"
  set status enable
  set query-v1-status enable
 next
end
config system snmp user
 edit "monitor"
  set security-level auth-no-priv
 next
end
config system ntp
 set ntpsync disable
end
config log syslogd setting
 set status enable
 set server 192.0.2.50
 set mode udp
end
config user ldap
 edit "Plain LDAP"
  set server "192.0.2.20"
  set secure disable
  set server-identity-check disable
  set password ENC LDAP_SECRET_NEVER_EXPORT
 next
end
config vpn ipsec phase1-interface
 edit "Legacy-Branch"
  set interface "wan1"
  set remote-gw 198.51.100.2
  set ike-version 1
  set proposal 3des-sha1 aes256-sha256
  set dhgrp 2 14
  set psksecret ENC NEVER_EXPORT_IPSEC_SECRET
 next
end
config vpn ipsec phase2-interface
 edit "Legacy-Selectors"
  set phase1name "Legacy-Branch"
  set src-subnet 10.10.10.0 255.255.255.0
  set dst-subnet 10.30.30.0 255.255.255.0
 next
end
config vpn ssl settings
 set status enable
 set source-interface "wan1"
 set ssl-min-proto-ver tls1-1
 set servercert "Expired-Test"
end
config system dhcp server
 edit 1
  set status enable
  set interface "lan1"
  set netmask 255.255.255.0
  set default-gateway 10.10.11.1
  config ip-range
   edit 1
    set start-ip 10.10.10.0
    set end-ip 10.10.10.255
   next
  end
  config reserved-address
   edit 1
    set ip 10.10.10.20
    set mac 02:00:00:00:00:01
   next
   edit 2
    set ip 10.10.10.20
    set mac 02:00:00:00:00:02
   next
  end
 next
end
config router static
 edit 1
  set dst 203.0.113.5 255.255.255.0
  set gateway 192.0.2.1
  set device "wan1"
 next
 edit 2
  set dst 198.51.100.0 255.255.255.0
  set gateway 224.0.0.1
  set device "wan1"
 next
 edit 3
  set dst 10.40.0.0 255.255.0.0
  set gateway 10.20.20.254
  set device "standby"
 next
end
config firewall address
 edit "Office"
  set subnet 10.10.10.0 255.255.255.0
 next
end
config firewall addrgrp
 edit "Cycle-A"
  set member "Cycle-B"
 next
 edit "Cycle-B"
  set member "Cycle-A"
 next
 edit "Missing-Group"
  set member "Unresolved-Custom-Object"
 next
end
config firewall policy
 edit 1
  set name "All-Traffic"
  set srcintf "lan1"
  set dstintf "wan1"
  set srcaddr "all"
  set dstaddr "all"
  set action accept
  set schedule "always"
  set service "ALL"
 next
 edit 2
  set name "All-Traffic-Duplicate"
  set srcintf "lan1"
  set dstintf "wan1"
  set srcaddr "all"
  set dstaddr "all"
  set action accept
  set schedule "always"
  set service "ALL"
 next
 edit 3
  set name "All-Traffic-Opposite"
  set srcintf "lan1"
  set dstintf "wan1"
  set srcaddr "all"
  set dstaddr "all"
  set action deny
  set schedule "always"
  set service "ALL"
 next
 edit 4
  set name "Retained-Rule"
  set status disable
  set srcintf "lan1"
  set dstintf "wan1"
  set srcaddr "all"
  set dstaddr "all"
  set action accept
  set schedule "always"
  set service "ALL"
 next
end
config firewall vip
 edit "Reversed-Ports"
  set extip 203.0.113.10
  set mappedip "10.10.10.20"
  set extintf "wan1"
  set portforward enable
  set protocol tcp
  set extport 8443-8440
  set mappedport 443
 next
end
