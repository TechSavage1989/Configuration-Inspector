#config-version=FGT120G-7.4.0-FW-build0000
config system global
 set hostname "Example firewall"
end
config system interface
 edit "port1"
  set ip 192.0.2.1 255.255.255.0
  set type physical
 next
end
config system dns
 set primary 192.0.2.53
 set secondary 198.51.100.53
 set protocol dot
end
config system dns-database
 edit "example"
  set domain example.test
  config dns-entry
   edit 1
    set hostname router
    set type A
    set ip 192.0.2.1
   next
  end
 next
end
config system dhcp server
 edit 1
  set interface port1
  set status disable
  set default-gateway 192.0.2.1
  config ip-range
   edit 1
    set start-ip 192.0.2.100
    set end-ip 192.0.2.200
   next
  end
  config reserved-address
   edit 1
    set ip 192.0.2.10
    set mac 02:00:00:00:00:01
   next
  end
 next
end
config router static
 edit 1
  set gateway 192.0.2.254
  set device port1
 next
 edit 2
  set dst 198.51.100.0 255.255.255.0
  set blackhole enable
  set status disable
 next
end
config router ospf
 set router-id 192.0.2.1
 config network
  edit 1
   set prefix 192.0.2.0 255.255.255.0
  next
 end
end
config router bgp
 set router-id 0.0.0.0
end
config vpn ipsec phase1-interface
 edit "Partner tunnel"
  set interface port1
  set remote-gw 203.0.113.2
 next
end
config vpn ipsec phase2-interface
 edit "Partner selectors"
  set phase1name "Partner tunnel"
  set src-subnet 192.0.2.0 255.255.255.0
  set dst-subnet 198.51.100.0 255.255.255.0
 next
end
config vpn ssl settings
 set port 443
 set status disable
end
config user local
 edit "reader"
  set type password
 next
end
config user group
 edit "Empty group"
  set group-type firewall
 next
end
config user setting
 set auth-timeout 5
end
config user ldap
 edit "Directory"
  set server 192.0.2.20
  set dn "dc=example,dc=test"
 next
end
config firewall address
 edit "none"
  set subnet 0.0.0.0 255.255.255.255
 next
 edit "Internal"
  set subnet 192.0.2.0 255.255.255.0
 next
end
config firewall addrgrp
 edit "Empty address group"
  set comment "Reserved group"
 next
end
config firewall service custom
 edit "HTTPS"
  set tcp-portrange 443
 next
end
config firewall policy
 edit 10
  set srcintf port1
  set dstintf port1
  set srcaddr "Internal"
  set dstaddr "all"
  set service "HTTPS"
  set action accept
  set status disable
 next
end
config antivirus profile
 edit "Scanning profile"
  set comment "Application scanning"
 next
end
config antivirus settings
 set machine-learning-detection disable
end
