#config-version=FGT120G-7.4.0-FW-build0000
config system global
 set hostname "Fundamentals firewall"
 set timezone 12
 set dst enable
 set admin-sport 8443
 set admin-ssh-port 2222
 set admin-port 8080
end
config system interface
 edit "port1"
  set type physical
  set ip 192.0.2.1 255.255.255.0
  set allowaccess https ssh ping
  set sflow-sampler both
  set sample-rate 4096
 next
end
config system ntp
 set ntpsync enable
 config ntpserver
  edit 1
   set server ntp.example.test
  next
 end
end
config log syslogd setting
 set status enable
 set server 192.0.2.50
 set port 6514
 set mode reliable
 set source-ip 192.0.2.1
end
config system sflow
 set collector-ip 192.0.2.60
 set collector-port 6343
end
config system netflow
 set collector-ip 192.0.2.61
 set collector-port 2055
end
config system ddns
 edit 1
  set ddns-server FortiGuardDDNS
  set ddns-domain branch.example.test
  set monitor-interface port1
 next
end
config system settings
 set default-voip-alg-mode kernel-helper-based
 set sip-helper disable
 set sip-expectation disable
 set ecmp-max-paths 4
end
config system session-helper
 edit 13
  set name sip
  set protocol 17
  set port 5060
 next
end
config voip profile
 edit "SIP inspection"
  set feature-set voipd
  config sip
   set status enable
  end
 next
end
config firewall policy
 edit 10
  set name "Voice traffic"
  set srcintf port1
  set dstintf port1
  set srcaddr all
  set dstaddr all
  set service ALL
  set action accept
  set voip-profile "SIP inspection"
 next
end
config system ha
 set mode a-p
 set group-name "Example cluster"
 set hbdev "port1" 50
 set monitor "port1"
 set session-pickup enable
end
config system link-monitor
 edit "WAN probe"
  set srcintf port1
  set server 192.0.2.254
  set protocol ping
  set failtime 5
 next
end
config system dhcp server
 edit 1
  set interface port1
  set default-gateway 192.0.2.1
  set netmask 255.255.255.0
  config ip-range
   edit 1
    set start-ip 192.0.2.100
    set end-ip 192.0.2.150
   next
  end
  config options
   edit 1
    set code 150
    set type ip
    set ip 192.0.2.80
   next
  end
 next
end
config router prefix-list
 edit "Advertised LAN"
  config rule
   edit 1
    set action permit
    set prefix 192.0.2.0 255.255.255.0
   next
  end
 next
end
