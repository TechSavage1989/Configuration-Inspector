hostname "Example stack"
vsf
   enable domain 1
   member 1
      type "JL558A" mac-address 020000-000001
      priority 200
      link 1 1/51
      link 2 1/52
      exit
   member 2
      type "JL256A" mac-address 020000-000002
      priority 128
      link 1 2/52
      link 2 2/51
      exit
   exit
vlan 1
   untagged 1/1-1/48,2/1-2/48
   no ip address
   exit
vlan 10
   tagged 1/49,2/49
   ip address 192.0.2.10 255.255.255.0
   exit
