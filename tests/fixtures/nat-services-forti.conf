#config-version=FGT120G-7.4.0-FW-build0000
config vdom
 edit tenantA
  config firewall service custom
   edit "Web HTTPS"
    set tcp-portrange 443
   next
   edit "Alternate HTTPS"
    set tcp-portrange 8443
   next
  end
  config firewall service group
   edit "Web services"
    set member "Web HTTPS" "Alternate HTTPS"
   next
  end
  config firewall vip
   edit "Explicit services"
    set extip 203.0.113.20
    set mappedip 192.0.2.20
    set extintf wan1
    set service "Web services"
   next
   edit "Rule services"
    set extip 203.0.113.21
    set mappedip 192.0.2.21
    set extintf wan1
    set portforward enable
    set extport 8443
    set mappedport 443
   next
   edit "Unrestricted definition"
    set extip 203.0.113.22
    set mappedip 192.0.2.22
   next
   edit "HTTPS listener"
    set extip 203.0.113.23
    set extport 443
    set type server-load-balance
    set server-type https
    set service "Web HTTPS"
    config realservers
     edit 1
      set ip 192.0.2.23
      set port 443
     next
    end
   next
  end
  config firewall vipgrp
   edit "Nested services"
    set member "Rule services" "Explicit services"
   next
   edit "Outer services"
    set member "Nested services"
   next
   edit "Loop A"
    set member "Loop B" "Explicit services"
   next
   edit "Loop B"
    set member "Loop A"
   next
  end
  config firewall policy
   edit 1
    set name "Publish web"
    set srcintf wan1
    set dstintf lan
    set srcaddr all
    set dstaddr "Outer services"
    set service "Web HTTPS"
    set action accept
   next
   edit 2
    set name "Disabled access"
    set status disable
    set srcintf wan1
    set dstintf lan
    set srcaddr all
    set dstaddr "Rule services"
    set service "Alternate HTTPS"
    set action accept
   next
   edit 3
    set name "Exclude web"
    set srcintf wan1
    set dstintf lan
    set srcaddr all
    set dstaddr "Rule services"
    set service "Web services"
    set service-negate enable
    set action accept
   next
  end
  config firewall central-snat-map
   edit 1
    set orig-addr all
    set dst-addr all
    set protocol 6
    set orig-port 1024-65535
    set dst-port 443
    set nat-ippool "Public pool"
   next
  end
 next
 edit tenantB
  config firewall service custom
   edit "Web HTTPS"
    set tcp-portrange 9443
   next
  end
  config firewall vip
   edit "Explicit services"
    set extip 203.0.113.120
    set mappedip 192.0.2.120
    set service "Web HTTPS"
   next
  end
 next
end
