set system host-name Review-Junos
set system services ssh protocol-version v1
set system services ssh root-login allow
set system services telnet
set system services web-management http
set snmp community public authorization read-write
set security ike proposal LEGACY encryption-algorithm 3des-cbc
set security ike proposal LEGACY dh-group group2
set security ike proposal LEGACY authentication-algorithm md5
set interfaces ge-0/0/0 unit 0 family inet address 192.0.2.1/24
