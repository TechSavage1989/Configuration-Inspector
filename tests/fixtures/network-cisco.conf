! Cisco IOS XE
hostname ExampleRouter
interface GigabitEthernet0/0
 ip address 203.0.113.1 255.255.255.0
 ip nat outside
!
interface GigabitEthernet0/1
 ip address 192.0.2.1 255.255.255.0
 ip nat inside
 ip policy route-map BRANCH
!
ip nat inside source static tcp 192.0.2.20 443 203.0.113.20 8443 extendable
ip nat inside source static 192.0.2.21 203.0.113.21
ip nat inside source static tcp 192.0.2.22 22 interface GigabitEthernet0/0 2222
ip nat pool OUTBOUND 203.0.113.100 203.0.113.110 netmask 255.255.255.0
ip nat inside source list 10 pool OUTBOUND overload
access-list 10 permit 192.0.2.0 0.0.0.255
route-map BRANCH permit 10
 match ip address 10
 set ip next-hop 203.0.113.254
!
time-range WORK
 periodic weekdays 08:00 to 18:00
!
radius-server host 192.0.2.10 auth-port 1812
end
