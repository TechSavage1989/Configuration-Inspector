#config-version=FGT120G-7.4.6-FW-build0000
config system global
 set hostname security-example
end
config system interface
 edit port1
  set ip 192.0.2.1 255.255.255.0
 next
end
config firewall address
 edit Inside
  set subnet 192.0.2.0 255.255.255.0
 next
end
config antivirus profile
 edit Shared
  config http
   set av-scan block
  end
 next
 edit certificate-looking-antivirus
 next
end
config antivirus settings
 set machine-learning-detection disable
end
config webfilter profile
 edit Web
  set comment "Web filtering for staff"
  config ftgd-wf
   config filters
    edit 1
     set category 52
     set action block
    next
   end
  end
 next
end
config application list
 edit Applications
  config entries
   edit 1
    set application 12345
    set action block
   next
  end
 next
end
config file-filter profile
 edit Files
  set status disable
  config rules
   edit Executables
    set protocol http ftp
    set action block
    set file-type exe
    set direction incoming
   next
   edit Documents
    set protocol http
    set action log
    set file-type pdf
   next
  end
 next
end
config ips sensor
 edit IPS
  config entries
   edit 1
    set severity high critical
    set action block
   next
  end
 next
end
config firewall ssl-ssh-profile
 edit Shared
  set caname RootCA
  config https
   set ports 443
   set status certificate-inspection
   set untrusted-cert block
  end
 next
end
config dnsfilter profile
 edit DNS-security
  set block-botnet enable
 next
end
config emailfilter profile
 edit Mail
  set comment "Mail scanning"
 next
end
config dlp profile
 edit Data
 next
end
config waf profile
 edit Web-server
 next
end
config firewall profile-group
 edit Mixed
  set av-profile Shared
  set ssl-ssh-profile Shared
  set webfilter-profile Web
 next
end
config vpn certificate ca
 edit RootCA
  set subject "CN=Example Root CA"
 next
end
config firewall policy
 edit 10
  set name Internet
  set srcintf port1
  set dstintf port1
  set srcaddr Inside
  set dstaddr all
  set service ALL
  set action accept
  set av-profile Shared
  set ssl-ssh-profile Shared
  set webfilter-profile Web
 next
end
