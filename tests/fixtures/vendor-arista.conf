! Command: show running-config
! device: leaf-example (DCS-7050SX3-48YC8, EOS-4.30.1F)
!
! boot system flash:/EOS-4.30.1F.swi
!
transceiver qsfp default-mode 4x10G
!
hostname leaf-example
ip name-server vrf MGMT 192.0.2.53
dns domain example.com
!
ntp server vrf MGMT 192.0.2.123
!
logging vrf MGMT host 192.0.2.5
!
spanning-tree mode mstp
!
username admin privilege 15 role network-admin secret sha512 TEST_SECRET_ONLY
!
vlan 10
   name users
!
vlan 20
   name servers
!
vrf instance MGMT
!
interface Ethernet1
   description Example access port
   switchport access vlan 10
!
interface Ethernet2
   description Example uplink
   switchport mode trunk
   switchport trunk allowed vlan 10,20
   channel-group 1 mode active
!
interface Port-Channel1
   description Example LAG
   switchport mode trunk
   switchport trunk allowed vlan 10,20
!
interface Management1
   vrf MGMT
   ip address 192.0.2.10/24
!
interface Vlan10
   ip address 10.0.10.1/24
!
ip routing
!
ip route 0.0.0.0/0 10.0.10.254
ip route vrf MGMT 0.0.0.0/0 192.0.2.1
!
management api http-commands
   no shutdown
!
daemon TerminAttr
   no shutdown
!
end
