#config-version=FGT120G-7.4.0-FW-build0000
config system global
 set hostname "Example firewall"
end
config system interface
 edit "wan1"
  set ip 203.0.113.1 255.255.255.0
  set type physical
 next
 edit "lan"
  set ip 192.0.2.1 255.255.255.0
  set type physical
 next
end
config firewall address
 edit "Inside"
  set subnet 192.0.2.0 255.255.255.0
 next
end
config firewall vip
 edit "Web VIP"
  set extip 203.0.113.20
  set mappedip 192.0.2.20
  set extintf wan1
  set portforward enable
  set protocol tcp
  set extport 8443
  set mappedport 443
 next
 edit "Web cluster"
  set type server-load-balance
  set extip 203.0.113.30
  set extintf wan1
  set server-type https
  set extport 443
  set ldb-method round-robin
  set monitor "HTTPS check"
  config realservers
   edit 1
    set ip 192.0.2.31
    set port 443
    set weight 2
   next
   edit 2
    set ip 192.0.2.32
    set port 443
    set status disable
   next
  end
 next
end
config firewall vip6
 edit "Web IPv6"
  set extip 2001:db8:1::20
  set mappedip 2001:db8:2::20
  set extintf wan1
 next
end
config firewall vip46
 edit "Web NAT46"
  set extip 203.0.113.46
  set mappedip 2001:db8:2::46
  set extintf wan1
 next
end
config firewall vip64
 edit "Web NAT64"
  set extip 2001:db8:1::64
  set mappedip 192.0.2.64
  set extintf wan1
 next
end
config firewall vipgrp
 edit "Public services"
  set interface wan1
  set member "Web VIP" "Web cluster"
 next
end
config firewall ippool
 edit "Outbound pool"
  set startip 203.0.113.100
  set endip 203.0.113.110
  set type overload
 next
end
config firewall ldb-monitor
 edit "HTTPS check"
  set type https
  set port 443
  set http-get /health
  set interval 10
 next
end
config firewall schedule recurring
 edit "Business hours"
  set day monday tuesday wednesday thursday friday
  set start 08:00
  set end 18:00
 next
end
config firewall schedule group
 edit "Working"
  set member "Business hours"
 next
end
config firewall policy
 edit 1
  set name "Publish services"
  set srcintf wan1
  set dstintf lan
  set srcaddr all
  set dstaddr "Public services"
  set service HTTPS
  set schedule Working
  set action accept
 next
 edit 2
  set name "Internet"
  set srcintf lan
  set dstintf wan1
  set srcaddr Inside
  set dstaddr all
  set service ALL
  set action accept
  set nat enable
  set ippool enable
  set poolname "Outbound pool"
 next
end
config router policy
 edit 1
  set input-device lan
  set src 192.0.2.0 255.255.255.0
  set dst 198.51.100.0 255.255.255.0
  set gateway 203.0.113.254
  set output-device wan1
 next
end
config vpn ipsec phase1-interface
 edit "Partner"
  set interface wan1
  set remote-gw 203.0.113.2
 next
end
config vpn ipsec phase2-interface
 edit "Partner networks"
  set phase1name Partner
  set src-subnet 192.0.2.0 255.255.255.0
  set dst-subnet 198.51.100.0 255.255.255.0
 next
end
config vpn ssl settings
 set source-interface wan1
 set tunnel-ip-pools Inside
 set port 443
 set status disable
end
config vpn ssl web portal
 edit "Staff portal"
  set tunnel-mode enable
  set web-mode disable
  set ip-pools Inside
 next
end
config user ldap
 edit "Directory"
  set server 192.0.2.10
  set dn "dc=example,dc=test"
  set port 636
 next
end
config user radius
 edit "MFA"
  set server 192.0.2.11
  set auth-port 1812
 next
end
config user tacacs+
 edit "Operators"
  set server 192.0.2.12
 next
end
