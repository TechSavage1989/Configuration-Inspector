version 15.2
hostname Fundamentals-Cisco
clock timezone EST -5
ntp server 192.0.2.10
ip ssh version 2
no ip http server
ip http secure-server
logging host 192.0.2.50 transport udp port 514
flow exporter EXAMPLE
 destination 192.0.2.60
 source Vlan20
 transport udp 2055
 export-protocol netflow-v9
!
vlan 20
 name Phones
!
interface GigabitEthernet1/0/1
 switchport mode access
 switchport access vlan 10
 switchport voice vlan 20
 mls qos trust dscp
 ip flow monitor EXAMPLE input
!
interface Vlan20
 ip address 192.0.2.1 255.255.255.0
 vrrp 20 ip 192.0.2.254
 vrrp 20 priority 110
!
ip igmp snooping vlan 20
ip prefix-list LAN seq 10 permit 192.0.2.0/24
ip dhcp pool PHONES
 network 192.0.2.0 255.255.255.0
 default-router 192.0.2.254
 option 150 ip 192.0.2.80
!
no ip nat service sip udp port 5060
line vty 0 4
 transport input ssh
!
