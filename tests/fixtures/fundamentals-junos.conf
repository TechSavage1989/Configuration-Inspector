set system host-name Fundamentals-Junos
set system time-zone America/New_York
set system ntp server 192.0.2.10
set system services ssh
set system services web-management https interface fxp0.0
set system syslog host 192.0.2.50 any warning
set protocols sflow collector 192.0.2.60 port 6343
set protocols sflow interfaces ge-0/0/0.0
set protocols sflow sample-rate ingress 4096
set protocols igmp-snooping vlan all
set protocols lldp-med interface ge-0/0/0.0 network-policy voice vlan-id 20
set routing-instances Voice instance-type virtual-router
set routing-instances Voice interface ge-0/0/0.0
set interfaces ge-0/0/0 unit 0 family inet address 192.0.2.1/24
set system authentication-order radius password
set security alg sip disable
