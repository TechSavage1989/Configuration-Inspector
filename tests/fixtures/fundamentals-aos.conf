hostname "Fundamentals switch"
time timezone -300
time daylight-time-rule continental-us-and-canada
timesync ntp
ntp server 192.0.2.10
ip ssh
no telnet-server
web-management ssl
logging 192.0.2.50
sflow 1 destination 192.0.2.60 6343
sflow 1 sampling 1-8 4096
sflow 1 polling 1-8 30
snmp-server host 192.0.2.51
snmp-server community "EXAMPLE-SECRET"
lldp run
vlan 20
 name "Phones"
 tagged 1
 untagged 2-8
 voice
 ip address 192.0.2.1 255.255.255.0
 ip igmp
 exit
interface 2
 lldp med network-policy voice vlan 20 priority 5 dscp 46
 qos trust dscp
 exit
ip dhcp pool VOICE
 network 192.0.2.0 255.255.255.0
 default-router 192.0.2.1
 option 150 ip 192.0.2.80
 exit
ip routing
