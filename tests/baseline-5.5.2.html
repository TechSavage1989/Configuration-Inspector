/* Item comparison uses the existing theme and detail blocks. */
.record-comparisons{padding:0 18px 18px;display:grid;gap:14px}.comparison-card{padding:16px;border:1px solid var(--line);border-radius:9px;background:var(--surface-soft);min-width:0}.comparison-scroll{overflow:auto;max-height:420px}.comparison-settings{width:100%;border-collapse:collapse;text-align:left;table-layout:fixed}.comparison-settings th,.comparison-settings td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere;white-space:pre-wrap}.comparison-settings th{font-weight:600}.comparison-settings .copy-value{max-width:100%;white-space:pre-wrap;overflow-wrap:anywhere}.comparison-card .technical-details{margin-top:12px}@media(max-width:520px){.record-comparisons{padding:0 8px 10px}.comparison-card{padding:10px}.comparison-settings{min-width:480px}}

/* Compact interface grouping preserves the theme and existing port badges. */
.glance-group{display:grid;grid-template-columns:155px minmax(0,1fr);gap:10px;padding:9px 0;border-top:1px solid var(--line)}.glance-group-label{display:flex;gap:6px;align-items:center;align-self:start;font-size:11px;color:var(--muted);padding-top:5px}.glance-group-label .icon{width:14px;height:14px;flex-shrink:0}.glance-group-label small{margin-left:auto;font-variant-numeric:tabular-nums}.glance-group-ports{min-width:0}.interface-kind-icon{display:inline-flex;vertical-align:middle;margin-right:5px;color:inherit;flex-shrink:0}.interface-kind-icon .icon{width:13px;height:13px}.interface-glance .interface-badge{align-items:center}.interface-glance .interface-badge .interface-kind-icon{margin-right:4px}.glance-module{display:grid;grid-template-columns:95px minmax(0,1fr);gap:7px;align-items:start;margin-bottom:5px}.glance-module>span{font-size:10px;color:var(--muted);padding-top:5px;overflow-wrap:anywhere}.glance-context{font-size:12px;color:var(--ink);margin:14px 0 5px}.interface-glance .interface-badge[data-display-state="configured"]{border-left-color:var(--accent);color:var(--ink)}.glance-state.configured:before{background:var(--accent)}@media(max-width:700px){.glance-group{grid-template-columns:1fr;gap:6px}.glance-group-label{max-width:240px}.glance-module{grid-template-columns:70px minmax(0,1fr)}}

.glance-controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.glance-hidden-note{margin:0 0 12px}

.record-source-text{white-space:pre-wrap;overflow-wrap:anywhere;max-height:420px;overflow:auto;background:var(--bg);padding:14px;border-radius:8px;font:12px/1.6 monospace;user-select:text}

<style>
.interface-glance .interface-badge{flex-wrap:nowrap;white-space:nowrap;justify-content:center;gap:4px;background:var(--surface-soft);color:var(--ink)}
.interface-glance .interface-badge.addressed,.interface-glance .interface-badge.layer2,.interface-glance .interface-badge.dynamic{border-left-color:#75b990}
.interface-glance .interface-badge.unassigned,.interface-glance .interface-badge.disabled,.interface-glance .interface-badge.unknown{border-left-color:#ad797b;color:var(--muted)}
.interface-glance .interface-badge.has-retained-settings{border-left-color:#d0a043;background:repeating-linear-gradient(135deg,var(--surface-soft) 0 5px,var(--inactive-stripe) 5px 9px);color:var(--ink);flex-wrap:nowrap;white-space:nowrap;justify-content:center}
.compact-status-legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin:0 0 12px;font-size:11px;color:var(--muted)}
.compact-status-legend .glance-state{display:inline-flex;align-items:center}
.compact-status-legend .glance-state:before{content:"";display:inline-block;width:16px;height:12px;border:1px solid var(--line);border-left:4px solid #75b990;background:var(--surface-soft);border-radius:2px;margin-right:6px}
.compact-status-legend .retained:before{border-left-color:#d0a043;background:repeating-linear-gradient(135deg,var(--surface-soft) 0 3px,var(--inactive-stripe) 3px 5px)}
.compact-status-legend .unused:before{border-left-color:#ad797b}
</style>

<style>
:root{--matrix-grid:#a5b3c4}:root[data-theme="dark"]{--matrix-grid:#53657e}
.matrix{border-collapse:separate;border-spacing:0;border-top:1px solid var(--matrix-grid);border-left:1px solid var(--matrix-grid)}
.matrix th,.matrix td{border:0;border-right:1px solid var(--matrix-grid);border-bottom:1px solid var(--matrix-grid)}
.matrix th{padding:10px 12px;font-size:11px;font-weight:600;color:var(--ink);background:var(--surface-soft)}
.matrix thead th{background:var(--surface-soft);border-bottom:2px solid var(--matrix-grid);box-shadow:none}
.matrix tbody th{background:var(--surface-soft);border-right:2px solid var(--matrix-grid);box-shadow:none}

.matrix td>button{height:100%;min-height:72px;border:0;border-radius:0;margin:0;box-shadow:none}

function configTree(it){
 const node=n=>({n,fields:[],children:[]}),root=node(it.n),add=(p,k,v)=>p.fields.push([k,v]);
 const object=(value,n)=>{const p=node(n);if(value!==null&&typeof value==='object'){const entries=Object.entries(value);if(!entries.length)add(p,'Value',Array.isArray(value)?'(empty list)':'(empty object)');for(const [k,v] of entries){const label=Array.isArray(value)?'Item '+(Number(k)+1):k;if(v!==null&&typeof v==='object'){if(Array.isArray(v)&&v.every(x=>x===null||typeof x!=='object'))add(p,label,v.length?v:'(empty list)');else p.children.push(object(v,label))}else add(p,label,v)}}else add(p,'Value',value);return p};
 if(Object.prototype.hasOwnProperty.call(it,'value'))return object(it.value,it.n);
 if(it.element){const xml=el=>{const p=node(el.tagName+(el.getAttribute('name')?' ['+el.getAttribute('name')+']':''));for(const a of el.attributes)add(p,'@'+a.name,a.value);for(const c of el.childNodes){if(c.nodeType===1){if(!c.children.length&&!c.attributes.length)add(p,c.tagName,c.textContent);else p.children.push(xml(c))}else if((c.nodeType===3||c.nodeType===4)&&c.textContent.trim())add(p,'Text',c.textContent.trim())}if(!p.fields.length&&!p.children.length)add(p,'Value','(empty element)');return p};return xml(it.element)}
 if(it.kv?.length){root.fields.push(...it.kv);return root}
 const text=(it.ln||[]).join('\n'),lines=text.split(/\r?\n/),stack=[root];
 const words=s=>(s.match(/"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|\S+/g)||[]).map(w=>/^(["']).*\1$/.test(w)?w.slice(1,-1):w);
 const field=(p,s)=>{const eq=s.match(/^([^=]+?)\s*=\s*(.*)$/);if(eq){const w=words(eq[2]);add(p,eq[1].trim(),w.length?w:['']);return}const w=words(s),op=w.shift();if(!op)return;if(op==='unset'){add(p,w.join(' '),'Explicitly unset');return}if(op==='set'){const k=w.shift();add(p,k||'Set',w.length?w:'Configured');return}if(op==='no'){add(p,w.join(' '),'Negated (no)');return}if(op==='ip'&&['address','helper-address','route','default-gateway'].includes(w[0])){add(p,'ip '+w.shift(),w.length?w:'Configured');return}add(p,op,w.length?w:'Configured')};
 if(lines.some(l=>/^\s*config\s+/.test(l))){for(const raw of lines){const s=raw.trim();if(!s||/^[#!]/.test(s))continue;const p=stack.at(-1);if(/^(config|edit)\s/.test(s)){const child=node(s.replace(/^(config|edit)\s+/,''));child.kind=s.split(' ')[0];p.children.push(child);stack.push(child)}else if(s==='next'){while(stack.length>1&&stack.at(-1).kind!=='edit')stack.pop();if(stack.length>1)stack.pop()}else if(s==='end'){while(stack.length>1&&stack.at(-1).kind==='edit')stack.pop();if(stack.length>1)stack.pop()}else field(p,s)}}
 else if(lines.some(l=>/^\s*(set|delete|activate|deactivate)\s+/.test(l))){for(const raw of lines){const s=raw.trim();if(!s||/^[#!]/.test(s))continue;const w=words(s),op=w.shift();if(op==='set'){if(w.length>1)add(root,w.slice(0,-1).join(' '),w.at(-1));else add(root,w.join(' '),'Configured')}else if(['delete','activate','deactivate'].includes(op))add(root,w.join(' '),op==='delete'?'Deleted':op==='activate'?'Activated':'Deactivated');else field(root,s)}}
 else if(/\{/.test(text)&&/\}/.test(text)){
 // Split structural delimiters only outside quoted strings and comments.
 let buffer='',quote='',escape=false,comment=false;const flush=()=>{const v=buffer.trim();buffer='';if(v)field(stack.at(-1),v)};
 for(const c of text){if(comment){if(c==='\n')comment=false;else continue}if(quote){buffer+=c;if(escape)escape=false;else if(c==='\\')escape=true;else if(c===quote)quote='';continue}if(c==='"'||c==="'"){quote=c;buffer+=c}else if(c==='#'){comment=true}else if(c==='{'){const child=node(buffer.trim()||'Group');buffer='';stack.at(-1).children.push(child);stack.push(child)}else if(c==='}'){flush();if(stack.length>1)stack.pop()}else if(c===';'||c==='\n')flush();else buffer+=c}flush();
 }else{for(const raw of lines){const s=raw.trim();if(!s||/^[!;#]/.test(s))continue;if(/^\[[^\]]+\]$/.test(s)){const child=node(s.slice(1,-1));root.children.push(child);stack.splice(1,stack.length,child);continue}if(/^(exit|end|next)$/.test(s)){stack.splice(1);continue}if(!/^\s/.test(raw)&&/^(vlan|interface)\s+/.test(s)){const child=node(s);root.children.push(child);stack.splice(1,stack.length,child);continue}field(stack.at(-1),s)}}
 let result=root;while(!result.fields.length&&result.children.length===1)result=result.children[0];return result;
}

  function inspectorTreeFields(node){
    return (node.fields.length?'<dl>'+node.fields.map(function(pair){return '<dt>'+h(readableKey(pair[0]))+'</dt><dd>'+copyValue(Array.isArray(pair[1])?pair[1].join(' '):String(pair[1]),'setting')+'</dd>';}).join('')+'</dl>':'')+node.children.map(function(child){return '<section class="inspector-setting-group"><h4>'+h(child.n)+'</h4>'+inspectorTreeFields(child)+'</section>';}).join('');
  }
  function overviewRoutes(){
    return records('routes').filter(function(r){return recordTab(r)==='routes'&&hasDetailValue(r.summary.destination);});
  }
  function routeCards(){
    var rows=overviewRoutes();if(!rows.length)return '';
    function value(r,key,type){var v=r.summary[key];if(!usefulDetailFact(r,key,v))return '';var ref=type?C.resolve(state.model,type,v,r.summary.ipVersion,r.scope):null;return ref?recName(ref):String(v);}
    function cell(label,v){return hasDetailValue(v)?'<span><small>'+h(label)+'</small><strong>'+h(v)+'</strong></span>':'';}
    return overviewSection('routecards','<section class="panel"><div class="panel-head"><h2 class="panel-title">Configured routes</h2><button class="quiet-button" data-overview-routes>View all ('+rows.length+')</button></div><div class="route-cards">'+rows.slice(0,12).map(function(r){var s=r.summary;return '<button class="route-card" data-record="'+h(r.id)+'">'+cell('Destination',value(r,'destination','addresses'))+cell('Next hop',value(r,'gateway','addresses')||value(r,'primaryGateway','routes')||value(r,'configuredGateways'))+cell('Interface',value(r,'interface','interfaces'))+(s.status==='Disabled'?cell('State','Disabled'):'')+(r.scope&&r.scope!=='global'?'<small>'+h(r.scope)+'</small>':'')+'</button>';}).join('')+'</div></section>');
  }
  document.addEventListener('click',function(event){if(event.target.closest('[data-overview-routes]')){state.categoryTabs.routes='routes';view('routes');}});
  function sectionNavigation(){
    if(!state.model)return '';
    return '<details class="inspector-nav-sections"><summary>Configuration sections <span>'+state.nativeSections.length+'</span></summary><input id="section-nav-query" type="search" placeholder="Find a section" aria-label="Find a configuration section">'+state.nativeSections.map(function(sec){return '<button class="nav-item" data-inspector-section="'+h(sec.id)+'">'+h(sec.name)+'<small>'+sec.fields.length+'</small></button>';}).join('')+'</details>';
  }
  document.addEventListener('input',function(e){if(e.target.id==='section-nav-query'){var q=e.target.value.toLowerCase();document.querySelectorAll('[data-inspector-section]').forEach(function(b){b.hidden=!b.textContent.toLowerCase().includes(q);});}});
  document.addEventListener('click',function(e){var t=e.target.closest('[data-inspector-section]');if(t){state.nativeSection=t.dataset.inspectorSection;state.nativeSourceOpen=false;view('sections');}});

  function renderWorkspace(){
    document.getElementById('workspace-tabs').innerHTML=workspace.length?'<div class="workspace-files" aria-label="Open configurations">'+workspace.map(function(m,i){return '<div class="workspace-file'+(m===state.model?' selected':'')+'"><button data-workspace="'+i+'" aria-pressed="'+(m===state.model)+'" title="'+h(m.meta.filename||m.meta.name)+'"><strong>'+h(m.meta.name||m.meta.filename)+'</strong><small>'+h(m.meta.vendor)+' / '+h(m.meta.filename||'Pasted configuration')+'</small></button><button data-remove-workspace="'+i+'" aria-label="Close '+h(m.meta.filename||m.meta.name)+'">'+icon('close')+'</button></div>';}).join('')+'<button class="button" data-action="open-file">'+icon('upload')+'Add files</button></div>':'';
  }
  async function importMany(files,target){
    if(state.busy)return;
    for(var file of (target==='comparison'?files.slice(0,1):files)){
      await importFile(file,target);
      var error=document.getElementById('import-error');
      if(error&&!error.hidden)break;
    }
  }
  function workspaceCompare(){
    var choices=workspace.map(function(m,i){return {m:m,i:i};}).filter(function(x){return x.m!==state.model&&x.m.meta.vendorId===state.model.meta.vendorId;});
    if(!choices.length)return '';
    return '<div class="panel"><div class="toolbar"><label for="workspace-comparison">Compare with an open configuration</label><select id="workspace-comparison" class="select"><option value="">Choose a configuration</option>'+choices.map(function(x){return '<option value="'+x.i+'"'+(state.comparison===x.m?' selected':'')+'>'+h(x.m.meta.filename||x.m.meta.name)+'</option>';}).join('')+'</select></div></div>';
  }
  function nativeSettings(section){
    if(!section)return '';
    if(/^(aruba-aos|aruba-cx|aruba-instant-on|cisco)$/.test(state.model.meta.vendorId)){var tree=configTree({n:section.name,ln:nativeSectionSource(section).text.split('\n')});return '<h3 class="detail-label">Configured values</h3><div class="native-values native-value-card">'+inspectorTreeFields(tree)+'</div>';}
    var groups=new Map();
    section.fields.filter(function(e){return !/^@(config|edit)$/.test(e.base||'');}).forEach(function(e){var id=e.recordId||'ungrouped';if(!groups.has(id))groups.set(id,[]);groups.get(id).push(e);});
    return '<h3 class="detail-label">Configured values</h3><div class="native-values">'+Array.from(groups).map(function(pair){
      var r=recordById(pair[0]);return '<details class="native-value-card" open><summary>'+h(r?recName(r):section.name)+' <span>'+pair[1].length+' settings</span></summary><dl>'+pair[1].map(function(e){var secret=C.secretKey(e.key)||C.secretKey(e.base)||(/command|line/i.test(e.base||'')&&C.secretKey(e.value));var value=state.hideSensitive&&secret?'[REDACTED]':String(e.value??'');return '<dt title="'+h(e.key)+'">'+h(readableKey(e.base||e.key))+'</dt><dd>'+copyValue(value||'(empty value)','setting value')+'</dd>';}).join('')+'</dl></details>';
    }).join('')+'</div>';
  }
  function mapModes(){return '<div class="map-modes"><button class="button" data-map-mode="detail" aria-pressed="'+!state.compactMap+'">Detailed map</button><button class="button" data-map-mode="compact" aria-pressed="'+!!state.compactMap+'">Compact map</button></div>';}
  // ConfigLens-inspired zone grouping uses the shared, scoped Studio record model.
  function compactNetworkMap(){
    var groups=new Map();records('interfaces').forEach(function(r){var name=r.summary.zone&&r.summary.zone!=='Not specified'?zoneName(r.summary.zone,r.scope):(r.summary.ip?'Routed interfaces':'Other interfaces');var key=(r.scope||'global')+' / '+name;if(!groups.has(key))groups.set(key,{name:name,scope:r.scope,rows:[]});groups.get(key).rows.push(r);});
    var cols=[[],[]];Array.from(groups.values()).forEach(function(g){var side=/wan|untrust|outside|internet/i.test(g.name)?0:1;cols[side].push(g);});
    if(!cols[0].length&&cols[1].length>1){var all=cols[1];cols=[all.filter(function(_,i){return i%2===0;}),all.filter(function(_,i){return i%2===1;})];}
    function col(items){return '<div class="compact-groups">'+items.map(function(g){return '<section class="compact-zone"><h3>'+h(g.name)+'<small>'+h(g.scope&&g.scope!=='global'?g.scope:'')+'</small></h3>'+g.rows.map(function(r){var a=(r.addresses||[]).map(function(a){return a.ip+(a.mask?' / '+a.mask:'');}).join(', ')||r.summary.ip||'No static IP';return '<button data-record="'+h(r.id)+'" class="compact-interface'+(r.summary.status==='Disabled'?' disabled-port':'')+'">'+interfaceKindIcon(r)+'<span class="compact-label"><strong>'+h(r.name)+'</strong><small>'+h(a)+'</small></span>'+(r.summary.vlan?'<span class="chip">VLAN '+h(r.summary.vlan)+'</span>':'')+'</button>';}).join('')+'</section>';}).join('')+'</div>';}
    return '<section class="panel"><div class="panel-head"><h2 class="panel-title">Interface and zone relationships</h2><span class="count-label">'+records('interfaces').length+' interfaces</span></div><div class="compact-network">'+col(cols[0])+'<div class="compact-device">'+icon('network')+'<strong>'+h(deviceIdentity().name)+'</strong><span>'+h(state.model.meta.vendor)+'</span></div>'+col(cols[1])+'</div><p class="support-note"></p></section>';
  }
  document.addEventListener('click',function(e){
    var t=e.target.closest('button');if(!t)return;
    if(t.hasAttribute('data-workspace')){setModel(workspace[Number(t.dataset.workspace)]);}
    else if(t.hasAttribute('data-remove-workspace')){var i=Number(t.dataset.removeWorkspace);var removed=workspace.splice(i,1)[0];if(!workspace.length)clearWorkspace();else if(removed===state.model)setModel(workspace[Math.min(i,workspace.length-1)]);else {if(state.comparison===removed)state.comparison=null;render();}}
    else if(t.hasAttribute('data-map-mode')){state.compactMap=t.dataset.mapMode==='compact';renderContent();}
  });
  document.addEventListener('change',function(e){if(e.target.id==='workspace-comparison'&&e.target.value!==''){state.comparison=workspace[Number(e.target.value)];state.page=1;state.query='';state.filter='all';renderContent();}});

  var globalTimer;
  document.addEventListener('input',function(event){
    if(event.target.id==='global-search'){
      clearTimeout(globalTimer);globalTimer=setTimeout(function(){
        state.globalQuery=el.global.value;state.view=state.globalQuery.trim()?'search':'overview';state.query='';state.filter='all';state.ipVersionFilter='all';state.page=1;state.sortKey='';render();
      },160);
    }else if(event.target.id==='findings-query'){state.findingsQuery=event.target.value;state.findingsLimit=40;preserveInput(renderContent);}
    else if(event.target.id==='related-settings-query'){var key=relatedSettingsKey(),settings=(state.relatedSettings||(state.relatedSettings={}))[key]||{};settings.open=true;settings.query=event.target.value;settings.limits={};state.relatedSettings[key]=settings;var scroll=el.content.scrollTop;preserveInput(renderContent);el.content.scrollTop=scroll;}
    else if(event.target.id==='table-query'){state.query=event.target.value;state.page=1;state.searchCollapsedInterfaces=new Set();preserveInput(renderContent);}
    else if(event.target.id==='raw-query'){state.rawQuery=event.target.value;state.rawPage=1;preserveInput(renderContent);}
    else if(event.target.id==='map-query'){state.mapQuery=event.target.value;state.mapSearchCollapsed=new Set();preserveInput(renderContent);}
    else if(event.target.id==='field-query'){state.drawerQuery=event.target.value;state.drawerLimit=200;preserveInput(renderDrawer);}
  });
  document.addEventListener('change',function(event){
    var id=event.target.id;
    if(id==='findings-severity'||id==='findings-area'){state[id==='findings-severity'?'findingsSeverity':'findingsArea']=event.target.value;state.findingsLimit=40;preserveInput(renderContent);}
    else if(id==='theme-choice'){applyTheme(event.target.value,true);}
    else if(id==='table-filter'){state.filter=event.target.value;state.page=1;state.searchCollapsedInterfaces=new Set();renderContent();}
    else if(id==='workspace-scope'){clearTimeout(globalTimer);state.scope=event.target.value;state.ruleFrom='';state.ruleTo='';state.mapQuery='';state.mapZone='';state.query='';state.globalQuery='';el.global.value='';state.filter='all';state.ipVersionFilter='all';state.sortKey='';state.sortDir=1;state.page=1;state.mapCollapsed=new Set();state.collapsedInterfaces=new Set();state.mapSearchCollapsed=new Set();state.searchCollapsedInterfaces=new Set();state.activeRecord=null;state.drawerHistory=[];state.technicalOpen=false;if(el.drawer.open)el.drawer.close();ensureRelevantView();preserveInput(render);}
    else if(id==='show-empty-sections'){state.showEmpty=event.target.checked;state.query='';state.filter='all';state.ipVersionFilter='all';state.sortKey='';state.page=1;ensureRelevantView();preserveInput(render);}
    else if(id==='rule-from'||id==='rule-to'){state[id==='rule-from'?'ruleFrom':'ruleTo']=event.target.value;state.page=1;preserveInput(renderContent);}
    else if(id==='map-zone'){state.mapZone=event.target.value;state.mapSearchCollapsed=new Set();preserveInput(renderContent);}
    else if(id==='ip-version-filter'){state.ipVersionFilter=event.target.value;state.page=1;renderContent();}
    else if(id==='page-size'){state.pageSize=Number(event.target.value);state.page=1;renderContent();}
    else if(id==='redact-export'){state.redactExport=event.target.checked;if(state.view==='exports')renderContent();}
    else if(id==='export-preview-format'){state.exportFormat=event.target.value;renderContent();}
    else if(id==='import-file'||id==='compare-file'){var files=Array.from(event.target.files);importMany(files,id==='compare-file'?'comparison':'primary');event.target.value='';}
  });
  document.addEventListener('toggle',function(event){if(event.target.id==='technical-details')state.technicalOpen=event.target.open;if(event.target.id==='native-source-details')state.nativeSourceOpen=event.target.open;if(event.target.id==='record-source-details')state.sourceOpen=event.target.open;},true);
  document.addEventListener('keydown',function(event){
    if(event.target?.hasAttribute('data-category-tab')&&['ArrowLeft','ArrowRight','Home','End'].includes(event.key)){var tabs=availableTabs(state.view);if(!tabs.length)return;var at=tabs.findIndex(function(t){return t.id===activeTab();});event.preventDefault();switchRecordTab(tabs[event.key==='Home'?0:event.key==='End'?tabs.length-1:(at+(event.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length].id);return;}
    var tag=document.activeElement?.tagName;
    if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='o'){event.preventDefault();state.importTarget='primary';document.getElementById('import-file').click();return;}
    if((event.key==='/'&&!['INPUT','TEXTAREA'].includes(tag))||((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='k')){
      event.preventDefault();el.global.focus();
    }
    if(event.key==='Escape'&&document.activeElement===el.global){clearTimeout(globalTimer);el.global.value='';view('overview');}
    if((event.key==='Enter'||event.key===' ')&&event.target.matches('tr[data-record],tr[data-diff-key]')){event.preventDefault();event.target.click();}
  });
  el.modal.addEventListener('cancel',function(event){if(state.busy)event.preventDefault();});
  [el.modal,el.drawer].forEach(function(dialog){dialog.addEventListener('click',function(event){if(event.target===dialog&&!state.busy){var box=dialog.getBoundingClientRect();if(event.clientX<box.left||event.clientX>box.right||event.clientY<box.top||event.clientY>box.bottom)dialog.close();}});});
  var dragDepth=0,overlay=document.getElementById('drag-overlay');
  document.addEventListener('dragenter',function(event){if(event.dataTransfer?.types.includes('Files')){event.preventDefault();dragDepth++;if(!state.busy)overlay.hidden=false;}});
  document.addEventListener('dragover',function(event){if(event.dataTransfer?.types.includes('Files'))event.preventDefault();});
  document.addEventListener('dragleave',function(event){event.preventDefault();dragDepth=Math.max(0,dragDepth-1);if(!dragDepth)overlay.hidden=true;});
  document.addEventListener('drop',function(event){
    event.preventDefault();dragDepth=0;overlay.hidden=true;var files=event.dataTransfer?.files;
    if(files&&files.length){var target=el.modal.open&&document.getElementById('paste-config')?state.importTarget:'primary';importMany(Array.from(files),target);}
  });
  window.addEventListener('pageshow',function(){var choice=document.getElementById('theme-choice');applyTheme(choice&&['light','dark'].includes(choice.value)?choice.value:document.documentElement.getAttribute('data-theme'),false);});
  document.getElementById('theme-choice').addEventListener('input',function(event){applyTheme(event.target.value,true);});
  initializeTheme();
  document.getElementById('search-icon').innerHTML=icon('search');document.getElementById('offline-icon').innerHTML=icon('download');
  document.getElementById('help-icon').innerHTML=icon('help');document.getElementById('mobile-menu').innerHTML=icon('menu');
  document.getElementById('drag-content').innerHTML=icon('upload')+'<strong>Drop your firewall or switch configuration</strong><p>Firewall exports, Aruba / Cisco text, Junos text or XML, Meraki JSON, or Config Studio JSON</p>';
  if(window.SW_OFFLINE){var offline=document.querySelector('.offline-link');offline.removeAttribute('href');offline.removeAttribute('download');offline.innerHTML=icon('lock')+' Offline edition';}
  if(window.SWDesktop){
    var offline=document.querySelector('.offline-link');offline.removeAttribute('href');offline.removeAttribute('download');offline.innerHTML=icon('ports')+' Desktop edition';
    window.SWDesktop.onOpen(function(data){if(state.busy)return;state.importTarget=data.target==='comparison'?'comparison':'primary';try{var decoded=data.bytes&&window.SWImporters?window.SWImporters.unpack(new Uint8Array(data.bytes),data.filename):data;importText(decoded.text,decoded.filename);}catch(e){showImport(state.importTarget);importError(e.message);}});
    window.SWDesktop.onAction(function(action){if(action==='export')showExportModal();else if(action==='help')showHelp();});
    window.SWDesktop.onDownload(function(data){toast(data.state==='completed'?'Saved '+data.filename+'.':data.state==='cancelled'?'Save cancelled.':'The file could not be saved. Try exporting again.');});
  }
  render();
})();

</script>

<script>
(function(){
  var highlighted=null;
  function clear(){if(highlighted)highlighted.querySelectorAll('.matrix-axis,.matrix-intersection').forEach(function(cell){cell.classList.remove('matrix-axis','matrix-intersection');});highlighted=null;}
  function paint(target){
    var cell=target&&target.closest?target.closest('.matrix tbody td'):null;
    clear();if(!cell)return;
    var table=cell.closest('.matrix'),row=cell.parentElement,column=cell.cellIndex;highlighted=table;
    Array.from(row.cells).forEach(function(item){item.classList.add('matrix-axis');});
    Array.from(table.rows).forEach(function(item){if(item.cells[column])item.cells[column].classList.add('matrix-axis');});
    cell.classList.add('matrix-intersection');
  }
  document.addEventListener('mouseover',function(event){if(event.target.closest('.matrix'))paint(event.target);});
  document.addEventListener('mouseout',function(event){var table=event.target.closest('.matrix');if(table&&(!event.relatedTarget||!table.contains(event.relatedTarget)))paint(document.activeElement);});
  document.addEventListener('focusin',function(event){if(event.target.closest('.matrix'))paint(event.target);});
  document.addEventListener('focusout',function(event){if(event.target.closest('.matrix'))paint(event.relatedTarget);});
})();
</script>
